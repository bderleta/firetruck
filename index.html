<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <title>Fire Truck</title>
  <style>
    :root {
      --bg: #0d1117;
      --panel: #171b22;
      --panel-2: #1d242d;
      --stroke: #2f3b45;
      --text: #edf2f7;
      --muted: #9aa8b5;
      --accent: #5cc6d8;
      --accent-2: #4fd1a2;
      --warn: #ffb347;
      --danger: #ff6a6a;
      --shadow: rgba(0, 0, 0, 0.22);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      display: flex;
      justify-content: center;
      padding: 10px;
      touch-action: manipulation;
    }

    .app {
      width: min(100%, 520px);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--stroke);
      border-radius: 16px;
      box-shadow: 0 10px 28px var(--shadow);
      padding: 12px;
    }

    .title {
      margin: 0;
      font-size: 1.2rem;
      letter-spacing: 0.03em;
      text-align: center;
    }

    .status {
      color: var(--muted);
      font-size: 0.78rem;
      text-align: center;
      min-height: 1em;
      margin-top: 4px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    button {
      appearance: none;
      border: 1px solid var(--stroke);
      border-radius: 12px;
      background: var(--panel-2);
      color: var(--text);
      font-size: 1rem;
      font-weight: 600;
      min-height: 56px;
      padding: 12px 10px;
      transition: transform 0.08s ease, background 0.12s ease, border-color 0.12s ease;
      touch-action: none;
      user-select: none;
    }

    button:active,
    button.active {
      transform: scale(0.98);
      border-color: var(--accent);
      background: rgba(92, 198, 216, 0.18);
    }

    button.on {
      background: rgba(79, 209, 162, 0.18);
      border-color: var(--accent-2);
    }

    .wide {
      grid-column: 1 / -1;
    }

    .controls {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      align-items: center;
    }

    .drive-panel {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 12px;
    }

    .joystick-shell {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 220px;
    }

    .joystick {
      position: relative;
      width: min(62vw, 220px);
      height: min(62vw, 220px);
      border-radius: 50%;
      border: 2px solid var(--stroke);
      background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.04), rgba(0,0,0,0.2));
      box-shadow: inset 0 0 18px rgba(0,0,0,0.3);
      overflow: hidden;
      touch-action: none;
      user-select: none;
    }

    .joystick::before {
      content: "";
      position: absolute;
      inset: 18%;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.08);
    }

    .stick {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 34%;
      height: 34%;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.15);
      background: linear-gradient(145deg, #2c4250, #1d2731);
      box-shadow: 0 8px 18px rgba(0,0,0,0.28);
      transform: translate(-50%, -50%);
      transition: transform 0.02s linear;
    }

    .joystick-label {
      position: absolute;
      font-size: 0.72rem;
      color: var(--muted);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      pointer-events: none;
    }

    .joystick-label.up { top: 10px; left: 50%; transform: translateX(-50%); }
    .joystick-label.down { bottom: 10px; left: 50%; transform: translateX(-50%); }
    .joystick-label.left { left: 10px; top: 50%; transform: translateY(-50%); }
    .joystick-label.right { right: 10px; top: 50%; transform: translateY(-50%); }

    .speed-readout {
      font-size: 0.82rem;
      color: var(--muted);
      text-align: center;
      margin-top: 8px;
    }

    .speed-readout strong {
      color: var(--text);
      font-size: 1.1rem;
    }

    .vertical-stack {
      display: flex;
      flex-direction: column;
      gap: 10px;
      justify-content: center;
    }

    .tiny {
      min-height: 48px;
      font-size: 0.9rem;
    }

    @media (max-width: 360px) {
      .grid { grid-template-columns: 1fr; }
      .controls { grid-template-columns: 1fr; }
      .drive-panel { grid-template-columns: 1fr; }
      .vertical-stack { flex-direction: row; justify-content: space-between; }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="panel">
      <h1 class="title">Fire Truck</h1>
      <div id="status" class="status" aria-live="polite"></div>
    </div>

    <div class="panel">
      <div class="grid">
        <button id="engineToggle" class="wide">🔑 Start engine</button>
        <button id="lightsToggle">🚨 Emergency lights</button>
        <button id="pumpBtn">💧 Water pump</button>
      </div>
    </div>

    <div class="panel">
      <div class="grid">
        <button class="momentary" data-endpoint="/ladder?cmd=off" data-press="/ladder?cmd=up">⬆️ Ladder up</button>
        <button class="momentary" data-endpoint="/ladder?cmd=off" data-press="/ladder?cmd=down">⬇️ Ladder down</button>
        <button class="momentary" data-endpoint="/turntable?cmd=off" data-press="/turntable?cmd=left">⬅️ Turn left</button>
        <button class="momentary" data-endpoint="/turntable?cmd=off" data-press="/turntable?cmd=right">➡️ Turn right</button>
      </div>
    </div>

    <div class="panel drive-panel">
      <div class="vertical-stack">
        <button id="brakeBtn" class="tiny">Brake</button>
      </div>

      <div>
        <div id="joystick" class="joystick" aria-label="Drive joystick">
          <span class="joystick-label up">F</span>
          <span class="joystick-label down">B</span>
          <span class="joystick-label left">L</span>
          <span class="joystick-label right">R</span>
          <div id="stick" class="stick"></div>
        </div>
        <div class="speed-readout"><strong id="speedValue">0</strong>%</div>
      </div>

      <div class="vertical-stack">
        <button id="coastBtn" class="tiny">Coast</button>
      </div>
    </div>
  </div>

  <script>
    const statusEl = document.getElementById('status');
    const speedValueEl = document.getElementById('speedValue');
    const engineToggle = document.getElementById('engineToggle');
    const lightsToggle = document.getElementById('lightsToggle');
    const pumpBtn = document.getElementById('pumpBtn');
    const brakeBtn = document.getElementById('brakeBtn');
    const coastBtn = document.getElementById('coastBtn');
    const joystick = document.getElementById('joystick');
    const stick = document.getElementById('stick');
    const momentaryButtons = document.querySelectorAll('.momentary');

    const state = {
      engineEnabled: false,
      lightsEnabled: false,
      pressed: false,
      joystickActive: false,
      keyboardActive: false,
      lastDriveCmd: null,
      lastDriveSpeed: 0,
      lastSteerCmd: null,
      lastBrake: false,
      lastPumpPressed: false,
      pointerId: null,
      keys: {
        up: false,
        down: false,
        left: false,
        right: false,
        brake: false
      }
    };

    function setStatus(text) {
      statusEl.textContent = text || '';
    }

    const API_BASE_URL = 'http://192.168.4.1';

    function fetchApi(path) {
      const url = /^https?:\/\//i.test(path) ? path : API_BASE_URL + (path.startsWith('/') ? path : '/' + path);
      return fetch(url, { method: 'GET', cache: 'no-store' })
        .then((response) => {
          if (!response.ok) {
            throw new Error('HTTP ' + response.status);
          }
        })
        .catch((err) => {
          console.error('API error:', url, err);
          setStatus('Controller unreachable');
        });
    }

    function toggleButtonState(button, active) {
      button.classList.toggle('on', active);
      button.classList.toggle('active', active);
    }

    function setMomentaryButton(button, active) {
      button.classList.toggle('active', active);
    }

    engineToggle.addEventListener('click', () => {
      state.engineEnabled = !state.engineEnabled;
      engineToggle.textContent = state.engineEnabled ? '🛑 Stop engine' : '🔑 Start engine';
      engineToggle.classList.toggle('on', state.engineEnabled);
      fetchApi(state.engineEnabled ? '/drive?cmd=enable' : '/drive?cmd=disable');
      setStatus(state.engineEnabled ? 'Drive enabled' : 'Drive disabled');
    });

    lightsToggle.addEventListener('click', () => {
      state.lightsEnabled = !state.lightsEnabled;
      lightsToggle.classList.toggle('on', state.lightsEnabled);
      lightsToggle.textContent = state.lightsEnabled ? '🚨 Lights on' : '🚨 Emergency lights';
      fetchApi(state.lightsEnabled ? '/emergency_lights?cmd=on' : '/emergency_lights?cmd=off');
      setStatus(state.lightsEnabled ? 'Emergency lights on' : 'Emergency lights off');
    });

    pumpBtn.addEventListener('pointerdown', (event) => {
      event.preventDefault();
      if (state.lastPumpPressed) return;
      state.lastPumpPressed = true;
      setMomentaryButton(pumpBtn, true);
      fetchApi('/pump?cmd=on');
      setStatus('Pump on');
    });

    const releasePump = () => {
      if (!state.lastPumpPressed) return;
      state.lastPumpPressed = false;
      setMomentaryButton(pumpBtn, false);
      fetchApi('/pump?cmd=off');
      setStatus('Pump off');
    };

    pumpBtn.addEventListener('pointerup', releasePump);
    pumpBtn.addEventListener('pointerleave', releasePump);
    pumpBtn.addEventListener('pointercancel', releasePump);

    momentaryButtons.forEach((button) => {
      const pressUrl = button.dataset.press;
      const offUrl = button.dataset.endpoint;

      button.addEventListener('pointerdown', (event) => {
        event.preventDefault();
        setMomentaryButton(button, true);
        fetchApi(pressUrl);
        setStatus(button.textContent.trim());
      });

      const release = () => {
        setMomentaryButton(button, false);
        if (offUrl) fetchApi(offUrl);
      };

      button.addEventListener('pointerup', release);
      button.addEventListener('pointerleave', release);
      button.addEventListener('pointercancel', release);
    });

    brakeBtn.addEventListener('pointerdown', (event) => {
      event.preventDefault();
      if (state.lastBrake) return;
      state.lastBrake = true;
      setMomentaryButton(brakeBtn, true);
      fetchApi('/drive?cmd=brake');
      setStatus('Brake engaged');
    });

    const releaseBrake = () => {
      if (!state.lastBrake) return;
      state.lastBrake = false;
      setMomentaryButton(brakeBtn, false);
      fetchApi('/drive?cmd=coast');
      setStatus('Brake released');
    };

    brakeBtn.addEventListener('pointerup', releaseBrake);
    brakeBtn.addEventListener('pointerleave', releaseBrake);
    brakeBtn.addEventListener('pointercancel', releaseBrake);

    coastBtn.addEventListener('click', () => {
      fetchApi('/drive?cmd=coast');
      fetchApi('/steer?cmd=off');
      state.lastDriveCmd = 'coast';
      state.lastSteerCmd = 'off';
      setStatus('Coasting');
    });

    function clamp(value, min, max) {
      return Math.min(Math.max(value, min), max);
    }

    function mapSpeed(value) {
      const normalized = clamp(Math.abs(value), 0, 1);
      return Math.round(200 + (normalized * 200));
    }

    function updateJoystickPosition(x, y) {
      const rect = joystick.getBoundingClientRect();
      const centerX = rect.left + rect.width / 2;
      const centerY = rect.top + rect.height / 2;
      const maxRadius = rect.width * 0.33;
      const dx = clamp(x - centerX, -maxRadius, maxRadius);
      const dy = clamp(y - centerY, -maxRadius, maxRadius);
      const distance = Math.hypot(dx, dy);
      const limitedX = distance > maxRadius ? (dx / distance) * maxRadius : dx;
      const limitedY = distance > maxRadius ? (dy / distance) * maxRadius : dy;

      stick.style.left = '50%';
      stick.style.top = '50%';
      stick.style.transform = `translate(calc(-50% + ${limitedX}px), calc(-50% + ${limitedY}px))`;
      return { dx: limitedX, dy: limitedY, maxRadius };
    }

    function sendDriveAndSteer(rawX, rawY) {
      const maxRadius = joystick.getBoundingClientRect().width * 0.33;
      const dx = clamp(rawX, -maxRadius, maxRadius);
      const dy = clamp(rawY, -maxRadius, maxRadius);
      const effectiveDy = -dy;
      const steerThreshold = maxRadius * 0.2;
      const driveThreshold = maxRadius * 0.12;

      let driveCmd = 'coast';
      let speedValue = 0;

      if (effectiveDy > driveThreshold) {
        driveCmd = 'forward';
        speedValue = mapSpeed(Math.abs(effectiveDy) / maxRadius);
      } else if (effectiveDy < -driveThreshold) {
        driveCmd = 'reverse';
        speedValue = mapSpeed(Math.abs(effectiveDy) / maxRadius);
      }

      let steerCmd = 'off';
      if (dx > steerThreshold) steerCmd = 'right';
      else if (dx < -steerThreshold) steerCmd = 'left';

      if (driveCmd !== state.lastDriveCmd || speedValue !== state.lastDriveSpeed) {
        if (driveCmd === 'coast') {
          fetchApi('/drive?cmd=coast');
        } else {
          fetchApi('/drive?cmd=' + driveCmd + '&speed=' + speedValue);
        }
        state.lastDriveCmd = driveCmd;
        state.lastDriveSpeed = speedValue;
      }

      if (steerCmd !== state.lastSteerCmd) {
        fetchApi('/steer?cmd=' + steerCmd);
        state.lastSteerCmd = steerCmd;
      }

      const displaySpeed = driveCmd === 'coast' ? 0 : Math.min(100, Math.round((speedValue / 400) * 100));
      speedValueEl.textContent = String(displaySpeed);
      setStatus(driveCmd === 'coast' ? 'Driving idle' : driveCmd + ' @ ' + speedValue + '');
    }

    function applyKeyboardMovement() {
      const up = state.keys.up || false;
      const down = state.keys.down || false;
      const left = state.keys.left || false;
      const right = state.keys.right || false;
      const brakePressed = state.keys.brake || false;

      if (brakePressed) {
        if (!state.lastBrake) {
          state.lastBrake = true;
          setMomentaryButton(brakeBtn, true);
          fetchApi('/drive?cmd=brake');
          setStatus('Brake engaged');
        }
        speedValueEl.textContent = '0';
        return;
      }

      if (state.lastBrake) {
        state.lastBrake = false;
        setMomentaryButton(brakeBtn, false);
        fetchApi('/drive?cmd=coast');
      }

      const dx = (right ? 1 : 0) - (left ? 1 : 0);
      const dy = (up ? 1 : 0) - (down ? 1 : 0);

      if (dx === 0 && dy === 0) {
        if (state.lastDriveCmd !== 'coast' || state.lastSteerCmd !== 'off') {
          fetchApi('/drive?cmd=coast');
          fetchApi('/steer?cmd=off');
          state.lastDriveCmd = 'coast';
          state.lastSteerCmd = 'off';
          state.lastDriveSpeed = 0;
          speedValueEl.textContent = '0';
          setStatus('Driving idle');
        }
        return;
      }

      let driveCmd = 'coast';
      let speedValue = 0;
      if (dy > 0) {
        driveCmd = 'forward';
        speedValue = 350;
      } else if (dy < 0) {
        driveCmd = 'reverse';
        speedValue = 350;
      }

      let steerCmd = 'off';
      if (dx > 0) steerCmd = 'right';
      else if (dx < 0) steerCmd = 'left';

      if (driveCmd !== state.lastDriveCmd || speedValue !== state.lastDriveSpeed) {
        if (driveCmd === 'coast') {
          fetchApi('/drive?cmd=coast');
        } else {
          fetchApi('/drive?cmd=' + driveCmd + '&speed=' + speedValue);
        }
        state.lastDriveCmd = driveCmd;
        state.lastDriveSpeed = speedValue;
      }

      if (steerCmd !== state.lastSteerCmd) {
        fetchApi('/steer?cmd=' + steerCmd);
        state.lastSteerCmd = steerCmd;
      }

      const displaySpeed = Math.min(100, Math.round((speedValue / 400) * 100));
      speedValueEl.textContent = String(displaySpeed);
      setStatus(driveCmd === 'coast' ? 'Driving idle' : driveCmd + ' @ ' + speedValue + '');
    }

    function resetJoystick() {
      state.joystickActive = false;
      stick.style.transform = 'translate(-50%, -50%)';
      state.lastDriveCmd = null;
      state.lastDriveSpeed = 0;
      state.lastSteerCmd = null;
      speedValueEl.textContent = '0';
      fetchApi('/drive?cmd=coast');
      fetchApi('/steer?cmd=off');
      setStatus('Joystick reset');
    }

    joystick.addEventListener('pointerdown', (event) => {
      event.preventDefault();
      state.joystickActive = true;
      state.pointerId = event.pointerId;
      joystick.setPointerCapture(event.pointerId);
      const pos = updateJoystickPosition(event.clientX, event.clientY);
      sendDriveAndSteer(pos.dx, pos.dy);
    });

    joystick.addEventListener('pointermove', (event) => {
      if (!state.joystickActive || event.pointerId !== state.pointerId) return;
      const pos = updateJoystickPosition(event.clientX, event.clientY);
      sendDriveAndSteer(pos.dx, pos.dy);
    });

    function handleJoystickRelease(event) {
      if (!state.joystickActive) return;
      if (event && event.pointerId !== undefined && event.pointerId !== state.pointerId) return;
      resetJoystick();
      joystick.releasePointerCapture?.(state.pointerId);
      state.pointerId = null;
    }

    joystick.addEventListener('pointerup', handleJoystickRelease);
    joystick.addEventListener('pointercancel', handleJoystickRelease);
    joystick.addEventListener('pointerleave', () => {
      if (!state.joystickActive) return;
      handleJoystickRelease();
    });

    function handleKeyChange(event, pressed) {
      const key = event.key.toLowerCase();
      if (key === 'arrowup' || key === 'w') state.keys.up = pressed;
      if (key === 'arrowdown' || key === 's') state.keys.down = pressed;
      if (key === 'arrowleft' || key === 'a') state.keys.left = pressed;
      if (key === 'arrowright' || key === 'd') state.keys.right = pressed;
      if (key === ' ') state.keys.brake = pressed;

      if (pressed) {
        state.keyboardActive = true;
      } else if (!state.keys.up && !state.keys.down && !state.keys.left && !state.keys.right && !state.keys.brake) {
        state.keyboardActive = false;
      }

      if (state.keys.brake) {
        if (!state.lastBrake) {
          state.lastBrake = true;
          setMomentaryButton(brakeBtn, true);
          fetchApi('/drive?cmd=brake');
          setStatus('Brake engaged');
        }
        speedValueEl.textContent = '0';
        return;
      }

      if (state.lastBrake) {
        state.lastBrake = false;
        setMomentaryButton(brakeBtn, false);
        fetchApi('/drive?cmd=coast');
      }

      if (state.keyboardActive) {
        applyKeyboardMovement();
      } else if (!state.joystickActive) {
        fetchApi('/drive?cmd=coast');
        fetchApi('/steer?cmd=off');
        state.lastDriveCmd = 'coast';
        state.lastDriveSpeed = 0;
        state.lastSteerCmd = 'off';
        speedValueEl.textContent = '0';
      }
    }

    document.addEventListener('keydown', (event) => {
      if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' ','w','W','a','A','s','S','d','D'].includes(event.key)) {
        event.preventDefault();
      }
      handleKeyChange(event, true);
    });

    document.addEventListener('keyup', (event) => {
      handleKeyChange(event, false);
    });
  </script>
</body>
</html>
